# Tests the game, then publishes it to GitHub Pages:
# https://jonathanjiwu.github.io/Cyberpunk-2D77/
#
# One-time setup: repository Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". After that, every push to main redeploys the game
# (only if the tests pass). Pull requests run the tests and the build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Play the game in a headless browser
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check that the scripts parse
        run: for f in js/*.js; do node --check "$f"; done

      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r js img sound _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
